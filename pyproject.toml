[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bf2d-solver"
version = "1.0.0"
description = "2D axisymmetric blast furnace solver (PISO + full physics)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Rachit"}]
license = {text = "Proprietary"}
dependencies = [
    "numpy>=1.24,<3.0",
    "scipy>=1.10,<2.0",
    "matplotlib>=3.7,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10.0",   # PYSEC-2026-1845: tmpdir-handling privesc,
                             # fixed 9.0.3; all pytest<9.0.3 is affected
    "pytest-cov>=4.1,<6.0",
    "ruff>=0.4",
    "bandit>=1.7",
    "pip-audit>=2.6",
]

[project.scripts]
bf2d-run = "run_simulation:main"

[tool.setuptools.packages.find]
include = ["bf2d*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: long-running integration tests (multi-minute solver runs); deselect with -m 'not slow'",
]

[tool.coverage.run]
source = ["bf2d"]
branch = true
# solver_gas.py (legacy SIMPLE/SIMPLEC) and solver_pressure.py (reference
# Darcy-Forchheimer) are kept for reference only -- simulation.py imports
# solver_gas_df.py exclusively (see README project-structure table) -- so
# they are intentionally never exercised by the test suite.
omit = ["bf2d/solver_gas.py", "bf2d/solver_pressure.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "N", "UP", "S", "A"]
# S101/B008: allow asserts in tests, mutable defaults in dataclass fields.
# N802/N803/N806/N815: plant/physics notation (T_g, u_r, wall_htc_W_m2K,
# _idx_P, ...) is the deliberate naming convention throughout this
# codebase -- matching the symbols in Fu 2014 / Zhou 2016 / Austin et al.
# 1997 is more valuable here than PEP8 snake_case.
# E702: the sparse-matrix assembly loops (solver_*.py) use a compact
# `add(i, j, v); b[i] = x` house style pervasively (~40 sites); this is a
# deliberate density choice for hot per-cell loops, not accidental style
# drift, so it is not worth reformatting into physics-critical code.
ignore = ["S101", "B008", "N802", "N803", "N806", "N815", "E702"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S311"]

[tool.bandit]
exclude_dirs = ["tests", ".github"]
