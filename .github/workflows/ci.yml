name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Weekly security scan
    - cron: '0 4 * * 1'

permissions:
  contents: read
  security-events: write

jobs:

  # ---------------------------------------------------------------------------
  # Unit tests + coverage
  # ---------------------------------------------------------------------------
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint (ruff)
        run: ruff check bf2d tests run_simulation.py

      - name: Run tests with coverage
        # slow-marked integration tests (multi-minute solver runs) are
        # covered by the plant-validation job's cz_inversion_m KPI gate.
        run: |
          pytest -m "not slow" --cov=bf2d --cov-report=xml \
                 --cov-report=term-missing \
                 --cov-fail-under=80 tests/

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 30

  # ---------------------------------------------------------------------------
  # SAST -- Bandit (Python security linter)
  # ---------------------------------------------------------------------------
  sast-bandit:
    name: SAST (Bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bandit
        run: pip install "bandit[toml]>=1.7"
      - name: Run bandit
        run: |
          bandit -r bf2d run_simulation.py -ll -f json -o bandit-report.json || true
          bandit -r bf2d run_simulation.py -ll
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json
          retention-days: 30

  # ---------------------------------------------------------------------------
  # SAST -- Semgrep (broader ruleset)
  # ---------------------------------------------------------------------------
  sast-semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: returntocorp/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Run semgrep
        run: |
          semgrep ci --config=p/python --config=p/security-audit \
                     --config=p/owasp-top-ten \
                     --sarif --output=semgrep.sarif || true
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif

  # ---------------------------------------------------------------------------
  # SCA -- pip-audit for known CVEs in dependencies
  # ---------------------------------------------------------------------------
  sca-pip-audit:
    name: SCA (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit dependencies
        run: pip-audit -r requirements.txt --strict --progress-spinner off

  # ---------------------------------------------------------------------------
  # Secret scanning
  # ---------------------------------------------------------------------------
  secret-scan:
    name: Secret scan (TruffleHog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          # Diff-scan only for PRs (base = PR base sha, head = PR head
          # sha).  For push events -- including the very first push to a
          # new repo, where base and head both resolve to the same
          # commit -- base/head are left empty so TruffleHog does a full
          # filesystem scan instead; a non-empty but identical base/head
          # pair is a known TruffleHog-action failure mode ("BASE and
          # HEAD are the same").
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
          head: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}
          extra_args: --only-verified

  # ---------------------------------------------------------------------------
  # CodeQL
  # ---------------------------------------------------------------------------
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v3

  # ---------------------------------------------------------------------------
  # Build + smoke test
  # ---------------------------------------------------------------------------
  smoke:
    name: Smoke test
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tiny simulation end-to-end
        run: |
          python run_simulation.py \
            --nr 10 --nz 25 --max-iter 10 \
            --output ./ci-smoke --no-plots --log-level ERROR
          test -f ./ci-smoke/metrics.json
          test -f ./ci-smoke/parameters.json

  plant-validation:
    name: Plant validation (Fu 2014 regression gate)
    runs-on: ubuntu-latest
    needs: []
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run plant-validation harness (fast mesh)
        # WARN statuses are allowed while calibration converges; any FAIL
        # (exit code 1) blocks the merge.  Report uploaded as artifact.
        run: python validate_plant.py --json validation_report.json
      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-report
          path: validation_report.json
